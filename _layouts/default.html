<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="icon" type="image/png" href="{{ "/assets/img/logo.png" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          {% if site.logo %}
          <div class="site-logo-wrap">
            <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" class="site-logo">
          </div>
          {% endif %}
          <div class="header-text">
            <h1 class="site-title">{{ site.title }}</h1>
            {% if site.description %}
            <p class="site-tagline">{{ site.description }}</p>
            {% endif %}
          </div>
        </div>
        <div class="header-actions">
          <a href="{{ site.chrome_url }}" class="btn btn-chrome" target="_blank" rel="noopener">
            Add to Chrome
          </a>
          <a href="{{ site.firefox_url }}" class="btn btn-firefox" target="_blank" rel="noopener">
            Add to Firefox
          </a>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
      </div>
    </footer>
  </body>
</html>
